// Restores Simple Backups zips on boot since Simple Backups only writes them. Server-only (does nothing on client).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' // version inherited from root - do NOT repeat it here
}

version = restore_version
group = mod_group_id

base {
    archivesName = 'bamfrestore'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
            programArgument 'nogui'
        }
    }

    mods {
        'bamfrestore' {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_license            : mod_license,
            restore_version        : restore_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

tasks.named('test') {
    useJUnitPlatform()
}
