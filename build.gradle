plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.11'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    /* Client only: this mod is purely cosmetic and registers nothing on the server. */
    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    /* The early-window terminal provider is a separate, service-only module: it must ship as its own
       TOP-LEVEL jar (built by the :earlywindow subproject) placed in the mods folder next to
       bamfmenu.jar -- it cannot be a classpath dependency or a jar-in-jar, because FancyModLoader
       selects the early-window provider from a mods-folder scan before either is visible. For dev it
       is dropped into run/mods/ (see the copyEarlyWindowToRunMods task below). */

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/* Plain JUnit, NOT ModDevGradle's unitTest block: the only testable classes in this module are the ones
   that touch no Minecraft class at all (Bugcheck, the blue screen's classification and every word it
   prints), so the tests need a JVM and nothing else. Adding the MDG test rig here would buy a game
   runtime for code that deliberately has no game in it. */
tasks.named('test') {
    useJUnitPlatform()
}

/* Build the early-window jar whenever the client run is prepared, and drop it into run/mods/ so the
   dev run discovers it as a top-level provider jar (mirroring the production two-jar layout). */
tasks.register('copyEarlyWindowToRunMods', Copy) {
    dependsOn ':earlywindow:jar'
    from project(':earlywindow').tasks.named('jar')
    into file('run/mods')
}
tasks.matching { it.name == 'prepareClientRun' || it.name == 'prepareRunClient' }.configureEach {
    dependsOn 'copyEarlyWindowToRunMods'
}

/* Keep internal docs SOURCE-ONLY: the architecture READMEs / .md notes explain the code for us but must never
   ship inside the mod jar. Excluded both at the resource-copy step (the realistic accident -- a doc dropped into
   resources) and on the final jar (catches a .md from any source dir). They stay in the repo where they are. */
tasks.withType(ProcessResources).configureEach {
    exclude '**/*.md'
}
tasks.named('jar') {
    exclude '**/*.md'
}

/* Reproducible archives, for every module at once. A jar is supposed to be a pure function of its content,
   and Gradle's defaults quietly make it a function of the CLOCK instead.
   THE GAP. preserveFileTimestamps defaults to TRUE, so every entry carries the wall-clock mtime of its copy
   in the build tree, and the synthesized META-INF/ directory entry gets stamped with the moment the jar task
   ran. a back to back re-jar of the 77MB early window, with compileJava UP-TO-DATE,
   changed exactly TWO bytes, the DOS mod-time of that one directory entry in the local header and again in
   the central directory, and came back with a completely different sha256. release.py decides "unchanged, do
   not upload" by sha256 alone, so the five jars we build went up the wire on every single release, 77MB of
   early window included, on releases where the only edit was somewhere else entirely. The 269 third party
   jars were never affected and always carried: they are static files sitting in drop/ that nothing rebuilds,
   which is exactly why this went unnoticed, the upload count looked reasonable. The cascade made our five
   worse: the shim carries the engine jar as a resource and the watchdog carries it again under
   META-INF/jarjar, so one engine re-jar moved three artifacts.
   THE GUARD. preserveFileTimestamps = false pins every entry to Gradle's constant 1980 stamp, so only real
   content can move the hash. reproducibleFileOrder = true sorts the entries too: the order was whatever the
   filesystem walk handed back, which happened to be stable on this NTFS volume every time we looked, and is
   not a thing to bet a release on.
   IMPORTANT: allprojects, NOT a bare tasks.withType up here. `tasks` in a build script means THIS project's
   tasks, so the bare form configures the root jar and silently misses all four subprojects, which is every
   jar that actually ships, and it looks completely correct while doing it. The watchdog's jarJar is a
   DefaultTask rather than an archive task so this never reaches it, and it does not need to: jarJar emits a
   directory that the ordinary jar task then packs, and the jar task is reached.
   Proof it is working is two clean builds in a row hashing the same, which is what tools/repro-check.ps1
   does. Run it after touching anything in here. */
allprojects {
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
