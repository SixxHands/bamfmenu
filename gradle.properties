org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

minecraft_version=1.21.1
minecraft_version_range=[1.21,1.22)
# Match the pack (loader pinned 21.1.235) so the dev runtime resolves the same NeoForge/FML.
neo_version=21.1.235
loader_version_range=[1,)
mod_id=bamfmenu
mod_name=BAMF: Menu
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.retro
mod_authors=Retro
mod_description=Retro terminal boot screens and Windows 95/XP window dressing for the pack.

# bamfos-updater module versions (independent of the menu mod version)
updater_version=0.1.0

# Core delivery counter: bump whenever core source changes or the new core will not overwrite disk.
# Keep four digits zero-padded (stub sorts generations lexically); 0000 is reserved for the bundled floor.
core_generation=0001
restore_version=1.0.0
