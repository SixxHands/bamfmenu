// Frozen boot stub (client locator jar in mods/, server entry jar at root). Only picks a core jar and hands over; FML locks this jar all session so we can't hot-update it.
plugins {
    id 'java-library'
}

version = updater_version
group = mod_group_id

base {
    archivesName = 'bamfos-updater-boot'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://libraries.minecraft.net' } // com.mojang:* transitives of FancyModLoader
}

// Bundled fallback engine extracted when .bamfos-updater/engine/ is missing or corrupt so the stub needs no networking.
configurations {
    baselineEngine {
        canBeConsumed = false
        canBeResolved = true
    }
    // Bundled fallback core written out as core-0000.jar if every generation on disk fails to load.
    baselineCore {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    baselineEngine project(':bamfos-updater-engine')
    baselineCore project(':bamfos-updater-core')

    // IModFileCandidateLocator lives inside FML's loader jar in 4.x; provided by NeoForge at runtime.
    compileOnly 'net.neoforged.fancymodloader:loader:4.0.42'

    // Test-only: the shipped stub must never link the engine, but EmbeddedTokenJarTest verifies encode/decode end-to-end.
    testImplementation project(':bamfos-updater-engine')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def baselineDir = layout.buildDirectory.dir('generated-baseline')

tasks.register('copyBaseline', Copy) {
    from(configurations.baselineEngine) {
        // Fixed resource path: EngineLoader reads /baseline/bamfos-updater-engine.jar.
        rename { 'bamfos-updater-engine.jar' }
    }
    into baselineDir.map { it.dir('baseline') }
}

sourceSets.main.resources.srcDir(baselineDir)

tasks.named('processResources') {
    dependsOn 'copyBaseline'
}

// Separate output dir so two Copy tasks don't overlap; processResources merges them under baseline/.
def baselineCoreDir = layout.buildDirectory.dir('generated-baseline-core')

tasks.register('copyBaselineCore', Copy) {
    from(configurations.baselineCore) {
        // Fixed resource path: CoreSlot.extract reads /baseline/bamfos-updater-core.jar.
        rename { 'bamfos-updater-core.jar' }
    }
    into baselineCoreDir.map { it.dir('baseline') }
}

sourceSets.main.resources.srcDir(baselineCoreDir)

tasks.named('processResources') {
    dependsOn 'copyBaselineCore'
}

// Optional build-time GitHub token from env or gitignored bamfos-token.local (never tracked).
// Builds cleanly with neither and falls back to .bamfos-updater/bamfos-updater.properties at runtime.
def embeddedToken = providers.environmentVariable('BAMFOS_GITHUB_TOKEN')
        .orElse(providers.fileContents(rootProject.layout.projectDirectory.file('bamfos-token.local')).asText)
        .map { it.trim() }
        .orElse('')

def tokenDir = layout.buildDirectory.dir('generated-token')

tasks.register('embedToken') {
    // Pass the digest, never the raw token, because Gradle writes inputs.property values in plaintext into .gradle/executionHistory.
    inputs.property('token', embeddedToken.map {
        it.isEmpty() ? '' : java.security.MessageDigest.getInstance('SHA-256')
                .digest(it.getBytes('ISO-8859-1')).encodeHex().toString()
    })
    outputs.dir(tokenDir)
    def outDir = tokenDir
    def value = embeddedToken
    doLast {
        File root = outDir.get().asFile
        root.deleteDir()
        root.mkdirs()
        String token = value.get()
        if (token.isEmpty()) {
            // No token configured; skip embedding and don't leave an empty baseline/idx/ folder in the jar.
            return
        }
        File shards = new File(root, 'baseline/idx')
        shards.mkdirs()
        // XOR mask -> base64 -> split into 3 shards (must stay in sync with EmbeddedToken.fromJar).
        byte[] mask = '7c1f9a4d3e60b285'.getBytes('ISO-8859-1')
        byte[] raw = token.getBytes('ISO-8859-1')
        for (int i = 0; i < raw.length; i++) {
            raw[i] = (byte) (raw[i] ^ mask[i % mask.length])
        }
        String b64 = raw.encodeBase64().toString()
        int a = (int) (b64.length() / 3)
        int b = (int) (2 * b64.length() / 3)
        [b64.substring(0, a), b64.substring(a, b), b64.substring(b)].eachWithIndex { part, i ->
            new File(shards, String.valueOf(i)).setText(part, 'ISO-8859-1')
        }
    }
}

sourceSets.main.resources.srcDir(tokenDir)

tasks.named('processResources') {
    dependsOn 'embedToken'
}

// Keep package README.md files out of the shipped jar.
tasks.withType(ProcessResources).configureEach {
    exclude '**/*.md'
}
tasks.named('jar') {
    exclude '**/*.md'
}

// Pass the built jar path to EmbeddedTokenJarTest (never pass the token via systemProperty; the test reads env/file directly).
def shimJar = tasks.named('jar').flatMap { it.archiveFile }

tasks.named('test') {
    useJUnitPlatform()
    dependsOn tasks.named('jar')
    def jarFile = shimJar
    doFirst {
        systemProperty 'bamfos.test.shimJar', jarFile.get().asFile.absolutePath
    }
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'com.retro.bamfos.updater.boot.ServerMain',
                   'Updater-Abi': '1',
                   'Implementation-Version': project.version
    }
}

/* THE FROZEN BUDGET. Every statement in these three files is permanent liability on every
   player's machine: FML opens this jar before our code exists and holds it all session, so no release can
   ever reach in and fix one of them. That point erodes one convenience method at a time, which is why this
   FAILS the build instead of warning about it. 90 against the 67 the split landed on, and that headroom is
   for a fix that genuinely cannot live in the core, never for a feature.
   Counted as semicolons at brace depth >= 2 once comments and literals are stripped, which is method-body
   statements: the package line, the imports and the field declarations sit shallower and do not count.
   COMMENTS ARE NOT IN THE BUDGET, because every warning in these files cost somebody a session. */
def frozenFiles = files(
        'src/main/java/com/retro/bamfos/updater/boot/ClientLocator.java',
        'src/main/java/com/retro/bamfos/updater/boot/CoreSlot.java',
        'src/main/java/com/retro/bamfos/updater/boot/UpdaterBridge.java')
def frozenLimit = 90

tasks.register('frozenBudget') {
    description = 'Fails the build when the frozen stub grows past its statement budget.'
    inputs.files(frozenFiles)
    def sources = frozenFiles
    def budget = frozenLimit
    doLast {
        int total = 0
        List<String> perFile = []
        for (File f : sources) {
            String text = f.getText('UTF-8')
            int n = text.length()
            int i = 0
            int depth = 0
            int count = 0
            while (i < n) {
                if (text.startsWith('//', i)) {
                    while (i < n && text.substring(i, i + 1) != '\n') {
                        i++
                    }
                } else if (text.startsWith('/*', i)) {
                    i += 2
                    while (i + 1 < n && !text.startsWith('*/', i)) {
                        i++
                    }
                    i += 2
                } else if (text.startsWith('"', i) || text.startsWith("'", i)) {
                    String quote = text.substring(i, i + 1)
                    i++
                    while (i < n && text.substring(i, i + 1) != quote) {
                        i += text.substring(i, i + 1) == '\\' ? 2 : 1
                    }
                    i++
                } else {
                    String c = text.substring(i, i + 1)
                    if (c == '{') {
                        depth++
                    } else if (c == '}') {
                        depth--
                    } else if (c == ';' && depth >= 2) {
                        count++
                    }
                    i++
                }
            }
            if (count == 0) {
                // a counter that has stopped understanding Java reads the same as a stub that shrank, and it
                // would sit here passing forever while the budget it guards quietly filled up. No frozen file
                // is ever legitimately empty, so ZERO means the parser broke and this run measured nothing
                throw new GradleException("${f.name} counted ZERO executable statements, so this gate is "
                        + "measuring nothing. Either the file was gutted or the counter below no longer reads "
                        + "Java: fix that before trusting any number it prints")
            }
            total += count
            perFile << "${f.name} ${count}"
        }
        if (total > budget) {
            throw new GradleException("the frozen stub is at ${total} executable statements and the budget is "
                    + "${budget} (${perFile.join(', ')}). Nothing in this jar can be fixed remotely, so a line "
                    + "only earns a place here if no release could ever carry it: put it in the CORE instead")
        }
        logger.lifecycle("frozen stub: ${total} of ${budget} executable statements (${perFile.join(', ')})")
    }
}

tasks.named('check') {
    dependsOn 'frozenBudget'
}

// Run the budget check on jar too so quick builds can't bypass it.
tasks.named('jar') {
    dependsOn 'frozenBudget'
}
