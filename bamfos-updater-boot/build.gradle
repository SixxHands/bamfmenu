/* The boot shim: tiny, deliberately boring, target churn ~never. Client side it sits in mods/ as a
   locator-service jar; server side a copy at server root provides Main-Class. Its whole job is load
   the engine -- ALL logic and ALL networking live in the engine module, because the shim is the one
   artifact that cannot hot-update and fragile code must never live there. */
plugins {
    id 'java-library'
}

version = updater_version
group = mod_group_id

base {
    archivesName = 'bamfos-updater-boot'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://libraries.minecraft.net' } // com.mojang:* transitives of FancyModLoader
}

// Bundled fallback engine extracted when .bamfos-updater/engine/ is missing or corrupt so the stub needs no networking.
configurations {
    baselineEngine {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    baselineEngine project(':bamfos-updater-engine')

    // IModFileCandidateLocator lives inside FML's loader jar in 4.x; provided by NeoForge at runtime.
    compileOnly 'net.neoforged.fancymodloader:loader:4.0.42'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def baselineDir = layout.buildDirectory.dir('generated-baseline')

tasks.register('copyBaseline', Copy) {
    from(configurations.baselineEngine) {
        // Fixed resource path: EngineLoader reads /baseline/bamfos-updater-engine.jar.
        rename { 'bamfos-updater-engine.jar' }
    }
    into baselineDir.map { it.dir('baseline') }
}

sourceSets.main.resources.srcDir(baselineDir)

tasks.named('processResources') {
    dependsOn 'copyBaseline'
}

// Keep package README.md files out of the shipped jar.
tasks.withType(ProcessResources).configureEach {
    exclude '**/*.md'
}
tasks.named('jar') {
    exclude '**/*.md'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'com.retro.bamfos.updater.boot.ServerMain',
                   'Updater-Abi': '1',
                   'Implementation-Version': project.version
    }
}
